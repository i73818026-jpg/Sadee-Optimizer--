name: SADEE Optimizer v2.1 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -e

          echo "=== Repository ==="
          ls -la

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          echo "Using: $ZIP_FILE"

          unzip -o "$ZIP_FILE" -d .

          echo "=== Project check ==="
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -d app
          test -d admin-dashboard

          echo "Project structure OK."

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Accept SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify Gradle project
        run: |
          java -version
          gradle --version

      - name: Build Optimizer + Key Dashboard
        shell: bash
        run: |
          set -o pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug \
            :admin-dashboard:assembleDebug \
            2>&1 | tee build.log

      - name: Verify APK files
        shell: bash
        run: |
          set -e

          OPTIMIZER="app/build/outputs/apk/debug/app-debug.apk"
          DASHBOARD="admin-dashboard/build/outputs/apk/debug/admin-dashboard-debug.apk"

          test -f "$OPTIMIZER"
          test -f "$DASHBOARD"

          echo "================================"
          echo "BUILD SUCCESS"
          echo "================================"

          ls -lh "$OPTIMIZER"
          ls -lh "$DASHBOARD"

      - name: Upload Optimizer APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-Optimizer-v2.1-Licensed
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Key Dashboard APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-Key-Dashboard-v1.0
          path: admin-dashboard/build/outputs/apk/debug/admin-dashboard-debug.apk
          if-no-files-found: error

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-Licensed-Build-Log
          path: build.log
          if-no-files-found: ignore
