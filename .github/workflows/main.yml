name: Build SADEE Optimizer APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Find and extract ZIP
      - name: Find and extract Android project ZIP
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Repository contents:"
          echo "======================================"
          ls -la

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            echo "Please upload the SADEE Optimizer ZIP file."
            exit 1
          fi

          echo "======================================"
          echo "Using ZIP file:"
          echo "$ZIP_FILE"
          echo "======================================"

          unzip -o "$ZIP_FILE" -d .

          echo "======================================"
          echo "After extraction:"
          echo "======================================"
          ls -la

          if [ ! -d "app" ]; then
            echo "ERROR: app folder was not found."
            echo "Checking folders:"
            find . -maxdepth 3 -type d | sort
            exit 1
          fi

          if [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts was not found."
            exit 1
          fi

          if [ ! -f "build.gradle.kts" ]; then
            echo "ERROR: build.gradle.kts was not found."
            exit 1
          fi

          echo "======================================"
          echo "Android project detected successfully!"
          echo "======================================"

      # 3. Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 4. Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      # 5. Accept licenses
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      # 6. Install Android SDK
      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 7. Gradle 8.9
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # 8. Check project
      - name: Check project
        shell: bash
        run: |
          echo "======================================"
          echo "Gradle version:"
          echo "======================================"
          gradle --version

          echo "======================================"
          echo "Android project files:"
          echo "======================================"
          find . -maxdepth 4 -type f | sort

      # 9. Build APK
      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail

          echo "======================================"
          echo "Building SADEE Optimizer APK..."
          echo "======================================"

          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee build.log

      # 10. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          echo "======================================"
          echo "Checking APK..."
          echo "======================================"

          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK successfully generated!"
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      # 11. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-Optimizer-v2-FreeFire
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 12. Upload build log if build fails
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-Optimizer-build-log
          path: build.log
          if-no-files-found: ignore
